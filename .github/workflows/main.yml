name: Build and Test DataMatrix Checker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Debug - list files
      run: |
        Write-Host "Repository structure (first 40 files):"
        Get-ChildItem -Recurse -File | Select-Object -First 40 FullName

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow PySide6
        # Explicitly install opencv-python (cv2)
        pip install opencv-python

    - name: Convert PNG icon to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])"

    - name: Find main entry script
      id: find_script
      run: |
        $possibleScripts = @("main.py", "src/main.py", "app.py", "run.py", "datamatrix_checker.py")
        $found = $null
        foreach ($script in $possibleScripts) {
          if (Test-Path $script) {
            $found = $script
            break
          }
        }
        if (-not $found) {
          $found = Get-ChildItem -Recurse -Filter "*.py" | Select-String -Pattern 'if __name__ == .__main__.' -List | Select-Object -First 1 -ExpandProperty Path
        }
        if ($found) {
          Write-Host "Found entry script: $found"
          echo "script_path=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          $scriptDir = Split-Path $found -Parent
          echo "script_dir=$scriptDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Error "No entry script found."
          exit 1
        }

    - name: Patch relative imports in entry script
      run: |
        $script = "$env:script_path"
        Write-Host "Patching relative imports in $script"
        (Get-Content $script) -replace 'from \.(\w+)', 'from $1' | Set-Content $script
        Write-Host "Patched lines:"
        Select-String "from " $script | Select-Object -First 10

    - name: Build with PyInstaller
      run: |
        $mainScript = "$env:script_path"
        pyinstaller --onefile `
                    --windowed `
                    --icon=assets/icon.ico `
                    --add-data "assets;assets" `
                    --paths "." `
                    --paths "$env:script_dir" `
                    --hidden-import "app" `
                    --collect-all "app" `
                    --hidden-import "cv2" `
                    --collect-all "cv2" `
                    --name "DataMatrixChecker" `
                    $mainScript

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataMatrixChecker-windows
        path: dist/DataMatrixChecker.exe

  # ---------- Lint and Test ----------
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest PySide6 opencv-python

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-report=xml --cov-report=html
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: junit/test-results.xml
      if: always()

  # ---------- Release ----------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, lint-and-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: DataMatrixChecker-windows
        path: dist/

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/DataMatrixChecker.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

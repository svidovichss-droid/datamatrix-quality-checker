name: Build and Test DataMatrix Checker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow PySide6

    - name: Convert PNG icon to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])"

    - name: Patch relative imports in main.py
      run: |
        # Replace 'from .module' with 'from module' (absolute import)
        # Also handles 'from .sub.module' -> 'from sub.module'
        (Get-Content main.py) -replace 'from \.(\w+)', 'from $1' | Set-Content main.py
        Write-Host "Patched main.py:"
        Select-String "from " main.py | Select-Object -First 10

    - name: Patch build.spec to use .ico instead of .png
      run: |
        (Get-Content build.spec) -replace 'icon\.png', 'icon.ico' | Set-Content build.spec
        Write-Host "Updated build.spec:"
        Get-Content build.spec | Select-String "icon"

    - name: Build with PyInstaller
      run: pyinstaller build.spec --noconfirm

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataMatrixChecker-windows
        path: dist/DataMatrixChecker.exe

  # ---------- lint-and-test and release jobs remain identical ----------
  # (omitted for brevity – copy from previous answer)

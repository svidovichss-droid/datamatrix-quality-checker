[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datamatrix-quality-checker"
version = "1.0.0"
description = "Lightweight DataMatrix quality grader for conveyor lines (webcam / GoPro / industrial cameras)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DataMatrix Quality Checker contributors"}]
keywords = ["datamatrix", "ecc200", "quality", "iso-15415", "aim-dpm", "conveyor", "vision", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PySide6>=6.6,<6.9",
    "opencv-python>=4.8,<4.11",
    "numpy>=1.26,<2.3",
    "Pillow>=10.0,<12.0",
    "pylibdmtx>=0.7.5",
    "python-dateutil>=2.8",
]

[project.scripts]
datamatrix-checker = "src.main:main"

[project.gui-scripts]
datamatrix-checker-gui = "src.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
